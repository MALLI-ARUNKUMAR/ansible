- name: fileters
  hosts: local
  connection: local
  vars:
    topics: linux,shell,ansible
    tags: 
      name: ansible
      project: roboshop
      component: catalogue 
    tags_list: [
              {
                  "key": "name",
                  "value": "ansible"
              },
              {
                  "key": "project",
                  "value": "roboshop"
              },
              {
                  "key": "component",
                  "value": "catalogue"
              }
           ]
   
  tasks:
  - name: convert string to list
    ansible.builtin.debug:
      msg: "{{ topics | split( ',')}}"
  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tags | dict2items }}"  

  - name: convert   list to map
    ansible.builtin.debug:
      msg: "{{ tags_list | items2dict }}"  
  - name: read the students.yaml
    ansible.builtin.set_fact:
      student_yaml: "{{ lookup ('file','student.yaml') | from_yaml }}"
  - name: convert YAML to JSON
    ansible.builtin.debug:
      msg: "{{ student_yaml | to_nice_json}}"            
