- name: fileters
  hosts: local
  connection: local
  vars:
    topics: linux,shell,ansible
    tags: 
      name: ansible
      project: roboshop
      component: catalogue 
    tags_list: [
              {
                  "key": "name",
                  "value": "ansible"
              },
              {
                  "key": "project",
                  "value": "roboshop"
              },
              {
                  "key": "component",
                  "value": "catalogue"
              }
           ]
   
  tasks:
  - name: convert string to list
    ansible.builtin.debug:
      msg: "{{ topics | split( ',')}}"
  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tags | dict2items }}"  

  - name: convert   list to map
    ansible.builtin.debug:
      msg: "{{ tags | items2dict }}"      
