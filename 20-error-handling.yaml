- name: error handling
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: check user exits or not
    ansible.builtin.command: id roboshop
    register: user_output

  - name: print userput         
    ansible.builtin.debug:
      msg: "{{ user_output }}"

  - name: creat user         
    ansible.builtin.command: useradd roboshop
    when: user_output.rc != 0    